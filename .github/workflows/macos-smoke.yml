name: macos-smoke
# Throwaway smoke test of BLASius's macOS provider assumptions. Standalone probe code only.
on:
  push:
    branches: [smoke/macos-arm64]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probes:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      ARMPL_TGZ_URL: https://developer.arm.com/-/cdn-downloads/permalink/Arm-Performance-Libraries/Version_26.07/arm-performance-libraries_26.07_macOS.tgz
    steps:
      - uses: actions/checkout@v4
      - id: sp
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install toolchains and Pythons
        shell: bash
        run: |
          set -x
          brew install openblas libomp python@3.13 uv || true
          curl -fsSL -o /tmp/py.pkg https://www.python.org/ftp/python/3.14.0/python-3.14.0-macos11.pkg && sudo installer -pkg /tmp/py.pkg -target / || true
          curl -fsSL -o /tmp/mf.sh https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-MacOSX-arm64.sh && bash /tmp/mf.sh -b -p $HOME/miniforge || true
          uv python install 3.13 || true
          python -m pip install -q scipy-openblas32 scipy-openblas64
      - name: Environment
        shell: bash
        run: |
          mkdir -p out
          { sw_vers; uname -a; clang --version | head -1; xcodebuild -version; csrutil status; } 2>&1 | tee out/env.log
      - name: (1)-(3) Accelerate
        continue-on-error: true
        shell: bash
        run: bash accel/run.sh 2>&1 | tee out/accel.log
      - name: (4) weak-stub override
        continue-on-error: true
        shell: bash
        run: bash weak/run.sh 2>&1 | tee out/weak.log
      - name: (5)+(7) Python builds, DYLD_*, ctypes preload
        continue-on-error: true
        shell: bash
        run: |
          export PYTHONS="clt=/usr/bin/python3
          homebrew=$(brew --prefix python@3.13)/bin/python3.13
          python.org=/Library/Frameworks/Python.framework/Versions/3.14/bin/python3.14
          setup-python=${{ steps.sp.outputs.python-path }}
          uv=$(uv python find 3.13 2>/dev/null)
          conda=$HOME/miniforge/bin/python3"
          bash python/run.sh 2>&1 | tee out/python.log
      - name: (6) row-major on Accelerate
        continue-on-error: true
        shell: bash
        run: bash rowmajor/run.sh 2>&1 | tee out/rowmajor.log
      - name: (8) two-level namespace isolation
        continue-on-error: true
        shell: bash
        run: |
          export BREW_OB=$(brew --prefix openblas)/lib/libopenblas.dylib
          export SCIPY32=$(ls $(python -c 'import scipy_openblas32 as s;print(s.get_lib_dir())')/*.dylib | head -1)
          export SCIPY64=$(ls $(python -c 'import scipy_openblas64 as s;print(s.get_lib_dir())')/*.dylib | head -1)
          bash isolation/run.sh 2>&1 | tee out/isolation.log
      - name: Providers (Homebrew OpenBLAS keg, ArmPL _mp)
        continue-on-error: true
        shell: bash
        run: bash providers/run.sh 2>&1 | tee out/providers.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probes-${{ matrix.os }}
          path: out/
  baseline:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install llvm (for llvm-objcopy)
        run: brew install llvm || true
      - name: Shipped-baseline pipeline on Mach-O
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p out
          bash baseline/run.sh 2>&1 | tee out/baseline.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-${{ matrix.os }}
          path: |
            out/
            baseline/build/*.log
